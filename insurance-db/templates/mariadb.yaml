apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB

metadata:
  name: mariadb

spec:
  image: "mariadb:{{ .Values.mariadb.imageTag }}"
  rootPasswordSecretKeyRef:
    name: mariadb
    key: password

  username: mariadb
  passwordSecretKeyRef:
    name: mariadb-password
    key: password
    generate: true
  database: {{ .Values.mariadb.database }}

  port: 3306

  storage:
    size: 1Gi
    # storageClassName: ebs-sc

  affinity:
    antiAffinityEnabled: true

  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 300m
      memory: 256Mi
    limits:
      memory: 512Mi

  metrics:
    enabled: true

  tls:
    enabled: false

  # HA 구성
  replicas: 3
  galera:
    enabled: true