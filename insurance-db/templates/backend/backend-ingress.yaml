apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress

spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: backend-service
              port:
                number: 80
